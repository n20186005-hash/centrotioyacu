name: Validate 150 guide build
on:
  push:
    branches: [verify/150-visitor-guides-20261124]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 801deed578bb8d3af13e77b6c136b80a06e0739f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Inspect local production HTML for every language and place
        run: |
          python - <<'PY'
          import json,pathlib,html
          g=json.loads(pathlib.Path('src/lib/destinations.json').read_text())
          root=pathlib.Path('.next/server/app')
          for locale in ('en','es','zh','qu'):
            for p in g:
              url=f'{locale}/nearby/{p["slug"]}'
              doc=html.unescape((root/(url+'.html')).read_text())
              c=p['local'][locale]
              checks=[c['name'],c['story'],*c['route'],c['question'],p['photo'],'site-footer','maps/search']
              assert all(i in doc for i in checks),url
          print('124 distinct rendered visitor pages passed')
          PY
