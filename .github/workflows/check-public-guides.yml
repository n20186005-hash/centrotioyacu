name: Diagnose live routing 150
on:
  push:
    branches: [verify/150-visitor-guides-20261124]
permissions: {}
jobs:
  routes:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python - <<'PY'
          import concurrent.futures,urllib.request,urllib.error,re,time
          base='https://www.centrotioyacu.com'
          paths=['/sitemap.xml','/en','/en/nearby','/zh/nearby','/en/nearby/mirador-punta-de-tahuishco','/en/nearby/mirador-punta-de-tahuishco/','/zh/nearby/mirador-punta-de-tahuishco','/es/nearby/centro-cultural-moyobamba','/qu/nearby/llanteria-birds']
          def probe(p):
           for q in ('','?verifyguide=150'):
            try:
             req=urllib.request.Request(base+p+q,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
             try:r=urllib.request.urlopen(req,timeout=18)
             except urllib.error.HTTPError as e:r=e
             with r:
              html=r.read().decode('utf-8','replace')
              print(r.status,p+q,'hrefs',html.count('/nearby/'),'has-guide',('area-directory' in html or 'place-hero' in html),'canonical',re.findall(r'<link rel="canonical"[^>]+>',html)[:1],'cache',r.headers.get('cf-cache-status'),r.headers.get('age'),len(html),'title',re.findall('<title>(.*?)</title>',html)[:1],flush=True)
            except Exception as e:print(repr(e),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:list(pool.map(probe,paths))
          PY
